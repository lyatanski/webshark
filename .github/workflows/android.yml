name: android

permissions:
  contents: write

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v7

    - name: Build
      run: >
        docker build -f Dockerfile.android --target apk
        --output type=local,dest=out .

    # compression-level 0 because an APK is a zip: re-deflating 140 MB of
    # already-stored dissectors costs minutes and saves nothing.
    - uses: actions/upload-artifact@v7
      with:
        name: webshark-arm64-apk
        path: out/webshark-arm64.apk
        compression-level: 0
