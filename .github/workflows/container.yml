name: container

permissions:
  contents: read
  packages: write

on:
  push:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: docker build -t ghcr.io/${{ github.actor }}/webshark .
    - name: Login
      run: >
        echo "${{ secrets.GITHUB_TOKEN }}"
        | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: Publish
      run: docker push ghcr.io/${{ github.actor }}/webshark
