apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "webshark-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "webshark-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "webshark-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "webshark-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "webshark-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: {{ include "webshark-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --health-probe-bind-address=:8081
            {{- if .Values.ui.enabled }}
            - --ui-bind-address=:8080
            {{- else }}
            - --ui-bind-address=
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            {{- end }}
            {{- if .Values.leaderElect }}
            - --leader-elect
            {{- end }}
            # The capture containers run this same image unless told otherwise.
            - --sniffer-image={{ default (include "webshark-operator.image" .) .Values.snifferImage }}
            - --poll={{ .Values.poll }}
            - --idle-poll={{ .Values.idlePoll }}
          env:
            # Where a Node-mode capture puts the pod that runs tcpdump: here,
            # next to the operator, which is why this is the one namespace that
            # has to allow hostPID and CAP_SYS_ADMIN.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
          ports:
            {{- if .Values.ui.enabled }}
            - name: http
              containerPort: 8080
            {{- end }}
            - name: health
              containerPort: 8081
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            initialDelaySeconds: 2
            periodSeconds: 10
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
