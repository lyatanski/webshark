{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "webshark-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "webshark-operator.labels" . | nindent 4 }}
  {{- with .Values.ui.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ui.service.type }}
  selector: {{- include "webshark-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
{{- end }}
